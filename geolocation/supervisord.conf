[program:sandbox-geolocation]
command=/usr/bin/python3 /opt/llm-sandbox/geolocation.py watch
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
stopsignal=TERM
stopwaitsecs=5
autorestart=true
startretries=20
priority=850
user=%(ENV_USER)s
stdout_logfile=%(ENV_LOG_DIR)s/geolocation.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
